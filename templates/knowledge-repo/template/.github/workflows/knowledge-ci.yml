# Validates postmortem frontmatter and builds the level-1 index on every push and pull request.
name: knowledge-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check postmortem frontmatter
        run: python scripts/check-frontmatter.py
      - name: Build index
        run: python scripts/build-index.py --out index.json
      - name: Upload index
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-index
          path: index.json
