[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kuanflow-cli"
dynamic = ["version"] # VERSION (SemVer) -> PEP 440, see hatch_build.py
description = "Kuanflow - AI-assisted SDLC workflows installer and updater"
readme = { text = "Kuanflow CLI. See https://github.com/<org>/kuanflow.", content-type = "text/plain" }
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "copier>=9.18.2,<10",
  "typer>=0.27",
  "pyyaml>=6.0",
  "tomlkit>=0.15",
  "rich>=15.0",
  "jsonschema>=4.26",
]

[project.scripts]
kuanflow = "kuanflow_cli.main:app"

[dependency-groups]
dev = [
  "hatchling>=1.27", # tests import hatch_build.py and run `python -m hatchling build`
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "ruff>=0.17",
]

[tool.hatch.metadata.hooks.custom] # hatch_build.py

[tool.hatch.build.targets.wheel]
packages = ["cli/src/kuanflow_cli"]

[tool.hatch.build.targets.wheel.force-include]
# Plugin + templates ship inside the wheel; the runtime locator reads kuanflow_cli/_content.
"plugins/kuanflow" = "kuanflow_cli/_content/plugins/kuanflow"
"templates" = "kuanflow_cli/_content/templates"

[tool.hatch.build.targets.sdist]
include = ["cli/src/kuanflow_cli", "plugins/kuanflow", "templates", "hatch_build.py", "VERSION", "LICENSE"]

[tool.uv]
# Re-build the editable install when the version source changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "hatch_build.py" },
  { file = "cli/src/kuanflow_cli/semver.py" },
  { file = "VERSION" },
]
